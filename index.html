<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Virtual Piano</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="home-page">

    <header class="home-header">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                ♫
            </span>

            <span>
                Virtual Piano
            </span>
        </a>

        <a
            class="header-link"
            href="instructions.html"
        >
            How to Play
        </a>

    </header>

    <section class="home-hero">

        <div class="home-hero-content">

            <p class="eyebrow">
                WELCOME
            </p>

            <h1>
                Something musical
                starts here.
            </h1>

            <p class="home-welcome">
                Go on. Play a note.
            </p>

            <a
                class="primary-button"
                href="piano.html"
            >
                Start Playing
                <span aria-hidden="true">
                    →
                </span>
            </a>

        </div>

        <div
            class="home-piano-visual"
            aria-hidden="true"
        >

            <div class="home-piano">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

                <i class="home-black-key black-1"></i>
                <i class="home-black-key black-2"></i>
                <i class="home-black-key black-3"></i>
                <i class="home-black-key black-4"></i>
                <i class="home-black-key black-5"></i>

            </div>

            <span
                class="home-floating-note note-1"
            >
                ♪
            </span>

            <span
                class="home-floating-note note-2"
            >
                ♫
            </span>

        </div>

    </section>

    <footer class="home-footer">

        <p>
            Play freely.
        </p>

        <a
            href="instructions.html"
        >
            How to Play
        </a>

    </footer>

</main>

</body>

</html>
