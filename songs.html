<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Listen to Songs</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="songs-page">

    <a
        class="back-home"
        href="index.html"
    >
        ← Back to Home
    </a>

    <header class="songs-header">

        <p class="eyebrow">
            LISTEN
        </p>

        <h1>
            Hear the Piano
        </h1>

        <p>
            Listen to a few melodies played
            using the virtual piano.
        </p>

    </header>

    <section
        id="songs-list"
        class="songs-list"
    ></section>

    <section class="songs-piano">

        <h2>
            Virtual Piano
        </h2>

        <div class="piano-wrapper">

            <div class="piano"></div>

        </div>

    </section>

    <div class="song-controls">

        <button
            id="stop-song"
            type="button"
        >
            Stop
        </button>

    </div>

    <div class="songs-footer">

        <a
            class="play-button"
            href="piano.html"
        >
            Play Piano
        </a>

        <a
            class="secondary-button"
            href="instructions.html"
        >
            How to Play
        </a>

    </div>

</main>

<script
    type="module"
    src="js/songs.js"
></script>

</body>

</html>
